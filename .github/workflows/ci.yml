name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirmar arquivos do site
        run: |
          set -euo pipefail
          for file in \
            public/index.html \
            public/style/style.css \
            public/script.js \
            public/robots.txt \
            public/sitemap.xml
          do
            test -s "$file"
          done
